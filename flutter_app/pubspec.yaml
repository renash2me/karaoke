name: karaoke
description: Sistema de karaokê self-hosted
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP e WebSocket
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  # Áudio
  just_audio: ^0.9.40
  # Microfone e pitch detection
  record: ^5.1.1
  # Armazenamento local
  shared_preferences: ^2.3.0
  # UI
  cupertino_icons: ^1.0.6
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
